name: Bermond quality gates
on:
  push:
    branches: [main]
  pull_request:
jobs:
  contract-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned GenLayer test and lint tools
        run: python -m pip install -r requirements-dev.txt
      - name: Contract syntax check
        run: python -m py_compile contracts/bermond.py
      - name: GenVM lint and SDK validation
        run: genvm-lint check contracts/bermond.py
      - name: Fake-runtime and GenLayer Direct Mode tests
        run: python -m pytest -q tests
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build production frontend
        run: npm run build
      - name: Frontend smoke checks
        run: npm test
